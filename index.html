<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TIU VIRTUAL</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon-192x192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="device-shell">
    <div class="mobile-frame">

      <!-- Barra Superior (App Bar) -->
      <header class="app-bar">
        <div class="app-bar-left">
          <button class="back-button" aria-label="Regresar" onclick="history.back()">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <h1 class="app-title">TIU VIRTUAL</h1>
        </div>
      </header>

      <!-- Contenido Principal -->
      <main class="main-content">
        <!-- Símbolo SVG vectorial de nube idéntico al diseño original -->
        <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
          <symbol id="cloud-vector" viewBox="0 0 56 25">
            <path d="M 5 25 C 2.2 25 0 22.8 0 20 C 0 17.5 1.8 15.4 4.2 15.1 C 4.6 9.8 9 5.5 14.5 5.5 C 16 5.5 17.4 5.9 18.7 6.6 C 21 2.5 25.5 0 30.5 0 C 37.8 0 43.8 5.4 44.8 12.5 C 45.6 12.3 46.5 12.2 47.5 12.2 C 52.2 12.2 56 16 56 20.7 C 56 23.1 54 25 51.5 25 Z"/>
          </symbol>
        </svg>

        <!-- Capa de nubes estilizadas con animación continua hacia la izquierda -->
        <div class="clouds-sky" aria-hidden="true">
          <div class="clouds-drift-track">
            <!-- Pista 1 -->
            <div class="clouds-group">
              <svg class="cloud-svg c-1"><use href="#cloud-vector"/></svg>
              <svg class="cloud-svg c-2"><use href="#cloud-vector"/></svg>
              <svg class="cloud-svg c-3"><use href="#cloud-vector"/></svg>
              <svg class="cloud-svg c-4"><use href="#cloud-vector"/></svg>
              <svg class="cloud-svg c-5"><use href="#cloud-vector"/></svg>
              <svg class="cloud-svg c-6"><use href="#cloud-vector"/></svg>
              <svg class="cloud-svg c-7"><use href="#cloud-vector"/></svg>
              <svg class="cloud-svg c-8"><use href="#cloud-vector"/></svg>
            </div>
            <!-- Pista 2 (clon idéntico para ciclo infinito continuo sin saltos) -->
            <div class="clouds-group">
              <svg class="cloud-svg c-1"><use href="#cloud-vector"/></svg>
              <svg class="cloud-svg c-2"><use href="#cloud-vector"/></svg>
              <svg class="cloud-svg c-3"><use href="#cloud-vector"/></svg>
              <svg class="cloud-svg c-4"><use href="#cloud-vector"/></svg>
              <svg class="cloud-svg c-5"><use href="#cloud-vector"/></svg>
              <svg class="cloud-svg c-6"><use href="#cloud-vector"/></svg>
              <svg class="cloud-svg c-7"><use href="#cloud-vector"/></svg>
              <svg class="cloud-svg c-8"><use href="#cloud-vector"/></svg>
            </div>
          </div>
        </div>

        <!-- Zona del Reloj Digital y Fecha -->
        <section class="clock-section">
          <div class="clock-card">
            <span id="clock" class="digital-time">22:56:56</span>
          </div>
          <p id="clock-date" class="digital-date">Miércoles, 16 Sept 2026</p>
        </section>

        <!-- Foto de Perfil Circular -->
        <section class="avatar-section">
          <div class="avatar-container">
            <img class="avatar-img" src="./avatar.png" alt="Foto de perfil del alumno" />
          </div>
        </section>

        <!-- Tarjeta de Información (Card View) -->
        <section class="info-card">
          <div class="student-name-container">
            <h2 class="student-name-line">JOSE LUIS A<span class="name-stars">***</span></h2>
            <h2 class="student-name-line">H<span class="name-stars">***</span></h2>
          </div>

          <div class="details-list">
            <div class="detail-item">
              <span class="detail-label">Código de alumno:</span>
              <strong class="detail-value" id="studentCode">20250H059</strong>
            </div>

            <div class="detail-item">
              <span class="detail-label">ID Banner:</span>
              <strong class="detail-value" id="studentBanner">N01410525</strong>
            </div>

            <div class="detail-career">
              <span id="studentCareer">INGENIERÍA DE SISTEMAS DE INFORMACIÓN</span>
            </div>

            <div class="detail-campus">
              <span class="campus-pin">📍</span>
              <span class="campus-text" id="studentCampus">Campus Monterrico</span>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    (function () {
      var clockEl = document.getElementById("clock");
      var dateEl = document.getElementById("clock-date");

      var timeFormatter = new Intl.DateTimeFormat("es-PE", {
        timeZone: "America/Lima",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });

      var dateFormatter = new Intl.DateTimeFormat("es-PE", {
        timeZone: "America/Lima",
        weekday: "long",
        day: "numeric",
        month: "short",
        year: "numeric"
      });

      function formatCustomDate(d) {
        var parts = dateFormatter.formatToParts(d);
        var weekday = "", day = "", month = "", year = "";
        parts.forEach(function (p) {
          if (p.type === "weekday") weekday = p.value;
          if (p.type === "day") day = p.value;
          if (p.type === "month") month = p.value.replace(".", "");
          if (p.type === "year") year = p.value;
        });

        function cap(s) {
          return s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
        }

        var monthMap = {
          "ene": "Ene", "feb": "Feb", "mar": "Mar", "abr": "Abr",
          "may": "Mayo", "jun": "Jun", "jul": "Jul", "ago": "Ago",
          "set": "Sept", "sep": "Sept", "sept": "Sept", "oct": "Oct", "nov": "Nov", "dic": "Dic"
        };
        var cleanMonth = monthMap[month.toLowerCase()] || cap(month);

        return cap(weekday) + ", " + day + " " + cleanMonth + " " + year;
      }

      function updateClock() {
        var now = new Date();
        if (clockEl) {
          clockEl.textContent = timeFormatter.format(now);
        }
        if (dateEl) {
          dateEl.textContent = formatCustomDate(now);
        }
      }

      updateClock();
      setInterval(updateClock, 1000);
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
